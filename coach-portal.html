<!DOCTYPE html>
<html lang="en">
<head>

<title>Coach Portal — Recruiting HQ</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
--navy:#0C2340;--navy-mid:#0f2d55;
--orange:#E87722;--orange-light:#f08c3a;
--chalk:#f8f6f2;--chalk-mid:#ede9e0;--white:#ffffff;
--text-dark:#0C2340;--text-mid:#3a4a5c;--text-light:#6a7a8c;
--radius:8px;--radius-lg:12px;
}
html{scroll-behavior:smooth}
body{font-family:'Inter',sans-serif;background:var(--chalk);color:var(--text-dark);-webkit-font-smoothing:antialiased;min-height:100vh}
.header{background:var(--navy);padding:14px 24px;display:flex;align-items:center;justify-content:space-between;border-bottom:2px solid var(--orange)}

.hero{background:var(--navy);padding:36px 24px 44px;text-align:center}

.main{max-width:900px;margin:0 auto;padding:32px 16px}
.form-card{background:var(--white);border:0.5px solid var(--chalk-mid);border-radius:var(--radius-lg);overflow:hidden;margin-bottom:16px}
.form-card-header{background:var(--navy);padding:14px 20px;display:flex;align-items:center;gap:10px}
.form-card-header h2{font-size:14px;font-weight:600;color:#fff}

.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field{display:flex;flex-direction:column;gap:4px}
.field.full{grid-column:1/-1}
.field label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.5px;color:var(--text-light)}
.field input,.field select{padding:9px 12px;border:0.5px solid var(--chalk-mid);border-radius:var(--radius);font-size:14px;background:var(--chalk);color:var(--text-dark);font-family:'Inter',sans-serif;width:100%}
.field input:focus,.field select:focus{outline:none;border-color:var(--orange);background:#fff}
.hint{font-size:12px;color:var(--text-mid);line-height:1.5;background:var(--chalk);border-radius:var(--radius);padding:10px 14px;margin-top:4px}
.selectivity-row{display:flex;gap:8px;margin-top:6px}
.sel-btn{flex:1;padding:12px;border:1px solid var(--chalk-mid);border-radius:var(--radius);background:var(--white);cursor:pointer;text-align:center;font-family:'Inter',sans-serif}
.sel-btn .t{font-weight:600;font-size:13px;color:var(--text-dark)}
.sel-btn .s{font-size:11px;color:var(--text-light);margin-top:2px}
.sel-btn.active{background:var(--navy);border-color:var(--navy)}
.sel-btn.active .t,.sel-btn.active .s{color:#fff}
.position-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.pos-tab{padding:6px 14px;border-radius:20px;border:0.5px solid var(--chalk-mid);font-size:12px;cursor:pointer;background:var(--white);color:var(--text-mid);font-family:'Inter',sans-serif;font-weight:500}
.pos-tab:hover{background:var(--chalk)}
.pos-tab.active{background:var(--navy);border-color:var(--navy);color:#fff}
.pos-tab.saved{border-color:#27500A;color:#27500A}
.pos-tab.saved.active{background:var(--navy);color:#fff}
.position-form{display:none}
.position-form.active{display:block}
.copy-row{display:flex;align-items:center;gap:8px;margin-bottom:14px;font-size:12px;color:var(--text-mid)}
.copy-row select{padding:6px 10px;border:0.5px solid var(--chalk-mid);border-radius:6px;font-size:12px;background:var(--chalk);font-family:'Inter',sans-serif}
.copy-row button{background:var(--white);border:0.5px solid var(--chalk-mid);border-radius:6px;padding:6px 12px;font-size:12px;cursor:pointer;font-family:'Inter',sans-serif;color:var(--text-mid)}
.copy-row button:hover{border-color:var(--orange);color:var(--orange)}
.metric-check-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:0.5px solid var(--chalk-mid)}
.metric-check-row input[type=checkbox]{width:18px;height:18px;accent-color:var(--orange);cursor:pointer;flex-shrink:0}
.metric-check-label{font-size:13px;font-weight:600;color:var(--text-dark);cursor:pointer;flex:1}
.metric-check-sub{font-size:11px;color:var(--text-light);font-weight:400}
.metric-detail{display:none;padding:0 0 16px 28px;margin-top:-6px;margin-bottom:6px}
.metric-detail.show{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.metric-detail .f{display:flex;flex-direction:column;gap:3px}
.metric-detail label{font-size:10px;font-weight:600;text-transform:uppercase;color:var(--text-light)}
.metric-detail input,.metric-detail select{padding:7px 9px;border:0.5px solid var(--chalk-mid);border-radius:6px;font-size:12.5px;background:var(--chalk);font-family:'Inter',sans-serif}
.save-pos-btn{background:var(--orange);color:#fff;border:none;border-radius:var(--radius);padding:10px 24px;font-size:13px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;margin-top:12px;display:inline-flex;align-items:center;gap:8px}
.save-pos-btn:hover{background:var(--orange-light)}
.save-pos-btn:disabled{opacity:0.6;cursor:not-allowed}
.saved-badge{font-size:11px;background:#EAF3DE;color:#27500A;padding:3px 8px;border-radius:20px;display:none}
